name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: NuGet restore
        run: nuget restore ToastFish.sln

      - name: Build
        run: msbuild ToastFish.sln /nologo /p:Configuration=Release /p:Platform="Any CPU"

      - name: Package
        run: |
          Remove-Item -Recurse -Force bin\Release\app.publish -ErrorAction SilentlyContinue
          Compress-Archive -Path bin\Release\* -DestinationPath ToastFish.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ToastFish
          path: ToastFish.zip
          if-no-files-found: error

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ToastFish.zip
          generate_release_notes: true
